; AMS overrides on top of php.ini-production.
expose_php = Off
memory_limit = 256M

; Leave attachments are at most 5 MB, CSV imports at most 2 MB.
upload_max_filesize = 6M
post_max_size = 8M

; All timestamps are stored in UTC; tenant time zones are applied in code.
date.timezone = UTC

; Code is baked into the image, so files never change while a container runs.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
