# One server for the central console and every workspace (<subdomain>.<domain>).
# The Host header reaches Laravel unchanged, which is how tenancy resolves the workspace.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 8m;   # matches PHP post_max_size (attachments <= 5 MB)

    # Resolve the upstreams through Docker's DNS on each request (variables below)
    # instead of once at start-up: a recreated app or reverb container gets a new
    # IP, which would otherwise leave nginx answering 502 until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $reverb_upstream http://reverb:8080;

    # Laravel: API, Sanctum CSRF cookie, Horizon dashboard, health check.
    # The API's own security headers are added by Laravel (SecurityHeaders).
    location ~ ^/(api|sanctum|broadcasting|horizon|up)(/|$) {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
    }

    # Reverb WebSockets (Pusher protocol, path /app/<key>) for the live Today board.
    # Same host and port as the SPA, so no extra origin, certificate or CSP entry.
    location /app/ {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The SPA (client-side routes fall back to index.html).
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
