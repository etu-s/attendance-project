openapi: 3.1.0
info:
  title: AMS API
  version: 0.7.0
  description: |
    Multi-tenant Attendance Management System. JSON only, versioned under `/api/v1`.

    **Hosts.** Central (super admin) endpoints live under `/api/v1/central` and only answer on
    central hosts (`localhost` in dev). Tenant endpoints live under `/api/v1` and only answer on a
    tenant subdomain (`<subdomain>.localhost` in dev); the subdomain selects the tenant.

    **Auth.** The SPA uses Sanctum cookie sessions: `GET /sanctum/csrf-cookie` first, then send the
    `X-XSRF-TOKEN` header (value of the `XSRF-TOKEN` cookie) on every mutating request. Requests must
    come from a stateful origin (`SANCTUM_STATEFUL_DOMAINS`). Devices and integrations post punches
    with a punch source key (`Authorization: Bearer ams_<prefix>_<secret>`, scheme PunchSourceKey).

    **Lists** accept `page`, `per_page` (max 100), `sort` (prefix `-` for descending) and `search`,
    plus per-endpoint filters, and return Laravel's paginated envelope (`data`, `links`, `meta`).

    **Errors.** `401` unauthenticated, `403` forbidden (or a suspended workspace), `404` unknown
    record or workspace, `409` business-rule conflict, `419` CSRF token mismatch, `422` validation
    (`errors` per field) or business rule (`rule`), `429` rate limited, `503` workspace provisioning.
  # Keep in sync with app/Modules/*/routes and the Http/Resources classes.

servers:
  - url: http://{subdomain}.localhost:5173
    description: Tenant workspace (dev, via the Vite proxy)
    variables:
      subdomain: { default: acme }
  - url: http://localhost:5173
    description: Central console (dev, via the Vite proxy)

tags:
  - name: Central auth
  - name: Plans
  - name: Tenants
  - name: Tenant auth
  - name: Users
  - name: Settings
  - name: Audit log
  - name: Health
  - name: Organization
  - name: Employees
  - name: Timetables
  - name: Scheduling
  - name: Attendance
  - name: Leave
  - name: Overtime

paths:
  /sanctum/csrf-cookie:
    get:
      summary: Issue the XSRF-TOKEN cookie
      tags: [Central auth, Tenant auth]
      security: []
      responses:
        '204': { description: Cookie set }

  # ---------------------------------------------------------------- central
  /api/v1/central/auth/login:
    post:
      tags: [Central auth]
      summary: Super admin login (starts a session on the `central` guard)
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/SuperAdminEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/central/auth/logout:
    post:
      tags: [Central auth]
      summary: End the super admin session
      responses: { '204': { description: Signed out }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /api/v1/central/auth/me:
    get:
      tags: [Central auth]
      summary: Current super admin
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuperAdminEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/central/plans:
    get:
      tags: [Plans]
      summary: List plans
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, created_at, -created_at, max_employees, -max_employees], default: name } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanPage' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Plans]
      summary: Create a plan
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PlanEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/central/plans/{plan}:
    parameters: [{ name: plan, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Plans]
      summary: Show a plan
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plans]
      summary: Update a plan (partial)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlanEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Plans]
      summary: Delete an unused plan
      responses:
        '204': { description: Deleted }
        '409': { description: 'Plan is assigned to tenants (`rule: plan_in_use`)', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }

  /api/v1/central/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: search, in: query, description: Name or subdomain, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, status, -status, created_at, -created_at], default: -created_at } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TenantStatus' } }
        - { name: plan_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TenantPage' } } } }
    post:
      tags: [Tenants]
      summary: Provision a tenant (database file, migrations, defaults, first Tenant Admin)
      description: Synchronous. On any failure the tenant row, domain and database file are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, subdomain, plan_id, timezone, admin_name, admin_email, admin_password, admin_password_confirmation]
              properties:
                name: { type: string, maxLength: 120 }
                subdomain: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])$', description: 'Lowercased; reserved names rejected; immutable' }
                plan_id: { type: integer, description: Must be an active plan }
                timezone: { type: string, example: Asia/Karachi }
                admin_name: { type: string, maxLength: 120 }
                admin_email: { type: string, format: email }
                admin_password: { type: string, minLength: 8, description: Letters and numbers }
                admin_password_confirmation: { type: string }
      responses:
        '201': { description: Provisioned, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/central/tenants/{tenant}:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Tenants]
      summary: Show a tenant
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } } }
    put:
      tags: [Tenants]
      summary: Update name or plan (the subdomain cannot change)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, maxLength: 120 }, plan_id: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tenants]
      summary: Permanently delete a suspended tenant (a VACUUM INTO backup is taken first)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [confirm], properties: { confirm: { type: string, description: The tenant subdomain, typed to confirm } } }
      responses:
        '204': { description: Deleted }
        '409': { description: 'Tenant is not suspended (`rule: tenant_not_suspended`)', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/central/tenants/{tenant}/suspend:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Tenants]
      summary: Suspend an active tenant (its routes answer 403)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } }
        '409': { description: Tenant is not active, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
  /api/v1/central/tenants/{tenant}/activate:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Tenants]
      summary: Reactivate a suspended tenant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } }
        '409': { description: Tenant is not suspended, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }

  # ---------------------------------------------------------------- tenant
  /api/v1/health:
    get:
      tags: [Health]
      summary: Tenant database liveness (public)
      security: []
      responses:
        '200': { description: Healthy, content: { application/json: { schema: { type: object, properties: { status: { const: ok }, database: { const: ok } } } } } }
        '403': { $ref: '#/components/responses/WorkspaceSuspended' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '503': { description: Database unavailable or workspace still provisioning }

  /api/v1/auth/login:
    post:
      tags: [Tenant auth]
      summary: Tenant user login (case-insensitive email; deactivated users are refused)
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/logout:
    post:
      tags: [Tenant auth]
      summary: End the session
      responses: { '204': { description: Signed out } }
  /api/v1/auth/me:
    get:
      tags: [Tenant auth]
      summary: Current user, permissions and workspace display preferences
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (permission users.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: search, in: query, description: Name or email, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, email, -email, status, -status, created_at, -created_at, last_login_at, -last_login_at], default: name } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user (users.create; only a Tenant Admin may assign tenant-admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email, description: Unique per tenant, including deleted users }
                password: { type: string, minLength: 8, description: Letters and numbers }
                role: { $ref: '#/components/schemas/Role' }
                status: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/users/{user}:
    parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Users]
      summary: Show a user
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update a user (partial; empty password keeps the current one)
      description: |
        Rules: a Tenant Admin account can only be edited by a Tenant Admin; nobody can change their own
        role or status (`rule: self_modification`, 403); the last active Tenant Admin cannot be demoted or
        deactivated (`rule: last_tenant_admin`, 409).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: [string, 'null'], minLength: 8 }
                role: { $ref: '#/components/schemas/Role' }
                status: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '403': { description: Forbidden or self-modification, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '409': { description: Last active Tenant Admin, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Soft-delete a user and revoke their API tokens (users.delete; not yourself)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Last active Tenant Admin, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }

  /api/v1/settings:
    get:
      tags: [Settings]
      summary: All settings with definitions and current values (settings.view)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Setting' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      summary: Update settings (settings.update)
      description: A list of key/value pairs, because keys contain dots. Errors are reported as `settings.<index>.value`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  items: { type: object, required: [key, value], properties: { key: { type: string, example: general.timezone }, value: {} } }
      responses:
        '200': { description: Updated list, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Setting' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/audit-logs:
    get:
      tags: [Audit log]
      summary: Append-only change history (audit-logs.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at], default: -created_at } }
        - { name: action, in: query, schema: { type: string, enum: [created, updated, deleted, restored, role_changed] } }
        - { name: actor_type, in: query, schema: { type: string, enum: [user, super_admin, system] } }
        - { name: actor_id, in: query, schema: { type: integer } }
        - { name: subject_type, in: query, schema: { type: string, example: user } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: from, in: query, description: Inclusive calendar day in the workspace timezone, schema: { type: string, format: date } }
        - { name: to, in: query, description: Inclusive calendar day in the workspace timezone, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- organization (Module 2)
  /api/v1/organization:
    get:
      tags: [Organization]
      summary: Organization profile (organization.view)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OrganizationProfile' } } } } } }
    put:
      tags: [Organization]
      summary: Update the profile (organization.update, Tenant Admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationProfile' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OrganizationProfile' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/locations:
    get:
      tags: [Organization]
      summary: List locations (locations.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, code, -code, created_at, -created_at], default: name } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Location' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
    post:
      tags: [Organization]
      summary: Create a location (locations.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Location' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/locations/{location}:
    parameters: [{ name: location, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Organization], summary: Show a location, responses: { '200': { description: OK } } }
    put:
      tags: [Organization]
      summary: Update a location (partial)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LocationInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Organization]
      summary: Delete a location never used in employee history
      responses:
        '204': { description: Deleted }
        '409': { description: 'In employee history (rule location_in_use)', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }

  /api/v1/departments:
    get:
      tags: [Organization]
      summary: The whole department tree in display order (departments.view; not paginated)
      parameters: [{ name: is_active, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Department' } } } } } } }
    post:
      tags: [Organization]
      summary: Create a department (departments.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/departments/{department}:
    parameters: [{ name: department, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Organization], summary: Show a department, responses: { '200': { description: OK } } }
    put:
      tags: [Organization]
      summary: Update a department (partial; rule department_cycle if moved under itself)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentInput' } } } }
      responses: { '200': { description: OK }, '422': { description: Validation or cycle } }
    delete:
      tags: [Organization]
      summary: Delete an empty department
      responses:
        '204': { description: Deleted }
        '409': { description: 'department_has_children or department_in_use', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
  /api/v1/departments/{department}/managers:
    parameters: [{ name: department, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Organization]
      summary: Replace managers (active user ids; managers see the department and its sub-departments)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerIds' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }

  /api/v1/groups:
    get:
      tags: [Organization]
      summary: List groups (groups.view), default order is priority
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, schema: { type: string, enum: [priority, -priority, name, -name, code, -code, created_at, -created_at], default: priority } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Group' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
    post:
      tags: [Organization]
      summary: Create a group (groups.manage); priority must be unique
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/groups/{group}:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Organization], summary: Show a group, responses: { '200': { description: OK } } }
    put:
      tags: [Organization]
      summary: Update a group (partial)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Organization]
      summary: Delete a group that never had members
      responses:
        '204': { description: Deleted }
        '409': { description: group_in_use, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
  /api/v1/groups/{group}/managers:
    parameters: [{ name: group, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Organization]
      summary: Replace group managers
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManagerIds' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }

  # ---------------------------------------------------------------- employees (Module 2)
  /api/v1/employees:
    get:
      tags: [Employees]
      summary: List employees visible to the caller
      description: |
        employees.view-all sees everyone; employees.view (Department Manager) sees employees currently in
        managed departments (incl. sub-departments) or managed groups. Department, location and groups are
        as of today in the workspace timezone. department_id includes sub-departments; search matches every
        word against code, first name, last name and email.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, employee_code, -employee_code, hire_date, -hire_date, status, -status, created_at, -created_at], default: name } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, terminated] } }
        - { name: employment_type, in: query, schema: { $ref: '#/components/schemas/EmploymentType' } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: location_id, in: query, schema: { type: integer } }
        - { name: group_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Employee' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Employees]
      summary: Create an employee (employees.create); assignment and groups start on hire_date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_code, first_name, last_name, employment_type, hire_date, department_id]
              properties:
                employee_code: { type: string, maxLength: 30, pattern: '^[A-Za-z0-9._-]+$', description: 'Unique (case-insensitive, incl. deleted); the punch identifier' }
                first_name: { type: string, maxLength: 80 }
                last_name: { type: string, maxLength: 80 }
                email: { type: [string, 'null'], format: email }
                phone: { type: [string, 'null'], maxLength: 30 }
                job_title: { type: [string, 'null'], maxLength: 120 }
                employment_type: { $ref: '#/components/schemas/EmploymentType' }
                hire_date: { type: string, format: date }
                department_id: { type: integer, description: Active department }
                location_id: { type: [integer, 'null'] }
                group_ids: { type: array, items: { type: integer } }
                create_login: { type: boolean, description: Also create a login (Employee role) with the email }
                login_password: { type: string, minLength: 8, description: Required when create_login }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Employee' } } } } } }
        '409': { description: 'Plan limit (rule plan_limit_reached)', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/employees/{employee}:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Employees]
      summary: Show an employee (403 when outside the visibility of the caller)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Employee' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Employees]
      summary: Update profile fields (employees.update)
      description: Department and location change via transfer; groups via the groups endpoints; status only active or inactive. A changed hire_date moves the start of history.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_code: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
                job_title: { type: [string, 'null'] }
                employment_type: { $ref: '#/components/schemas/EmploymentType' }
                hire_date: { type: string, format: date }
                status: { type: string, enum: [active, inactive] }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Employees]
      summary: Soft-delete a mistaken record (employees.delete, Tenant Admin); frees the linked login
      responses: { '204': { description: Deleted } }
  /api/v1/employees/{employee}/history:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Employees]
      summary: Dated department/location and group history (newest first)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/EmployeeHistory' } } } } } } }
  /api/v1/employees/{employee}/transfer:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Employees]
      summary: Change department/location from a date (backdating allowed; later history kept)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [department_id, location_id, effective_from], properties: { department_id: { type: integer }, location_id: { type: [integer, 'null'] }, effective_from: { type: string, format: date } } } } }
      responses:
        '200': { description: OK }
        '422': { description: 'Validation, or before_hire_date, after_termination_date, no_assignment_on_date, assignment_unchanged' }
  /api/v1/employees/{employee}/terminate:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Employees]
      summary: Terminate (employees.terminate); closes history on the date and deactivates the login by default
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [termination_date], properties: { termination_date: { type: string, format: date }, deactivate_login: { type: boolean, default: true } } } } }
      responses:
        '200': { description: OK }
        '403': { description: self_termination }
        '422': { description: 'employee_terminated, before_hire_date or history_after_date' }
  /api/v1/employees/{employee}/reinstate:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Employees]
      summary: Rehire after termination; department/location default to the last held
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [effective_from], properties: { effective_from: { type: string, format: date }, department_id: { type: [integer, 'null'] }, location_id: { type: [integer, 'null'] } } } } }
      responses:
        '200': { description: OK }
        '409': { description: plan_limit_reached }
        '422': { description: 'employee_not_terminated or rehire_before_termination' }
  /api/v1/employees/{employee}/groups:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Employees]
      summary: Join a group from a date
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [group_id, effective_from], properties: { group_id: { type: integer }, effective_from: { type: string, format: date } } } } }
      responses: { '200': { description: OK }, '422': { description: 'membership_overlap, group_inactive, before_hire_date, employee_terminated' } }
  /api/v1/employees/{employee}/groups/{group}/end:
    parameters:
      - { name: employee, in: path, required: true, schema: { type: integer } }
      - { name: group, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Employees]
      summary: End a membership on a date (inclusive); a membership that had not started yet is removed
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [effective_to], properties: { effective_to: { type: string, format: date } } } } }
      responses: { '200': { description: OK }, '422': { description: not_a_member } }
  /api/v1/employees/{employee}/user:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Employees]
      summary: Link (or unlink with null) the login; one employee per login
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { type: [integer, 'null'] } } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/employee:
    get:
      tags: [Employees]
      summary: The employee record of the signed-in user (self-service)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Employee' } } } } } }
        '404': { description: Login not linked to an employee }
  /api/v1/employees/import:
    post:
      tags: [Employees]
      summary: Queue a CSV import (employees.import); poll the returned import
      description: |
        Header row required. Required columns: employee_code, first_name, last_name, hire_date (Y-m-d),
        department_code. Optional: email, phone, job_title, employment_type, location_code, group_codes
        (separated by semicolons). Max 2 MB / 5,000 rows. Valid rows are created, invalid rows reported by line.
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/EmployeeImport' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/employee-imports:
    get: { tags: [Employees], summary: Recent imports (employees.import), responses: { '200': { description: OK } } }
  /api/v1/employee-imports/{employeeImport}:
    parameters: [{ name: employeeImport, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Employees]
      summary: Import status and row errors
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/EmployeeImport' } } } } } } }

  # ---------------------------------------------------------------- timetables & shifts (Module 3)
  /api/v1/timetables:
    get:
      tags: [Timetables]
      summary: List timetables (timetables.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, code, -code, start_minute, -start_minute, created_at, -created_at], default: name } }
        - { name: type, in: query, schema: { type: string, enum: [fixed, flexible] } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Timetable' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
    post:
      tags: [Timetables]
      summary: Create a timetable with its breaks (timetables.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableDetail' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/timetables/{timetable}:
    parameters: [{ name: timetable, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Timetables]
      summary: Show a timetable with meta.locked and meta.effective (grace/windows after workspace defaults)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableDetail' } } } } }
    put:
      tags: [Timetables]
      summary: Update (partial; `breaks` replaces the set). Time rules of a timetable in use are read-only.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TimetableInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableDetail' } } } }
        '409': { description: 'timetable_locked', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Timetables]
      summary: Delete a timetable that is in no shift
      responses:
        '204': { description: Deleted }
        '409': { description: timetable_in_use, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
  /api/v1/timetables/{timetable}/duplicate:
    parameters: [{ name: timetable, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Timetables]
      summary: Copy with a free code (CODE-2, CODE-3, ...); the way to change a locked timetable
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableDetail' } } } } }

  /api/v1/shifts:
    get:
      tags: [Timetables]
      summary: List shifts with their cycles (shifts.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, code, -code, created_at, -created_at], default: name } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Shift' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
    post:
      tags: [Timetables]
      summary: Create a shift header (shifts.manage); set its days with PUT shifts/{id}/days
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/shifts/{shift}:
    parameters: [{ name: shift, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Timetables]
      summary: Show a shift (meta.locked = used by a schedule)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Shift' }, meta: { type: object, properties: { locked: { type: boolean } } } } } } } } }
    put:
      tags: [Timetables]
      summary: Update (partial). A shorter cycle must not cut off working days; the cycle of a shift in use is read-only.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ShiftInput' } } } }
      responses:
        '200': { description: OK }
        '409': { description: shift_locked, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Timetables]
      summary: Delete a shift that no schedule uses
      responses:
        '204': { description: Deleted }
        '409': { description: shift_in_use, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
  /api/v1/shifts/{shift}/days:
    parameters: [{ name: shift, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Timetables]
      summary: Replace the whole cycle (days not listed are rest days)
      description: |
        At most 3 active timetables per day. Periods may not overlap, including an overnight period
        running into the next day and the last day running into day 0 of the next cycle. Errors are
        reported per day as `days.<day_index>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: array
                  items: { type: object, required: [day_index, timetable_ids], properties: { day_index: { type: integer, minimum: 0 }, timetable_ids: { type: array, items: { type: integer } } } }
      responses:
        '200': { description: OK }
        '409': { description: shift_locked }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/shifts/{shift}/duplicate:
    parameters: [{ name: shift, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Timetables], summary: Copy with its cycle and a free code, responses: { '201': { description: Created } } }
  /api/v1/shifts/{shift}/preview:
    parameters: [{ name: shift, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Timetables]
      summary: The cycle laid onto real dates (UTC instants; real minutes differ on DST days)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: At most 62 days after from }
        - { name: anchor, in: query, schema: { type: string, format: date }, description: 'Date the cycle starts (default: from). Week cycles count from its Monday.' }
        - { name: timezone, in: query, schema: { type: string }, description: 'Default: workspace timezone' }
      responses:
        '200':
          description: Every date in range, with periods (empty = rest day)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date, description: Work date = the date a period starts }
                        day_index: { type: integer }
                        periods:
                          type: array
                          items: { type: object, properties: { timetable: { type: object }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, minutes: { type: integer } } }
                  meta: { type: object, properties: { timezone: { type: string } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- scheduling (Module 4)
  /api/v1/schedule-assignments:
    get:
      tags: [Scheduling]
      summary: Dated shift assignments (schedules.view). Managers see employee-level rows of their own people only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [effective_from, -effective_from, created_at, -created_at], default: -effective_from } }
        - { name: target_type, in: query, schema: { type: string, enum: [organization, department, group, employee] } }
        - { name: target_id, in: query, schema: { type: integer } }
        - { name: shift_id, in: query, schema: { type: integer } }
        - { name: active_on, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ScheduleAssignment' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
    post:
      tags: [Scheduling]
      summary: Assign a shift to a target from a date (schedules.manage)
      description: |
        With effective_to the new period overwrites that range (periods inside are removed, crossing ones
        trimmed, a spanning one split). Without it the period runs until the next planned period (or the end
        of the period it starts in). anchor_date (cycle start) defaults to effective_from. Fires ScheduleChanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, shift_id, effective_from]
              properties:
                target_type: { type: string, enum: [organization, department, group, employee] }
                target_id: { type: [integer, 'null'], description: null for organization }
                shift_id: { type: integer, description: Active shift }
                effective_from: { type: string, format: date }
                effective_to: { type: [string, 'null'], format: date }
                anchor_date: { type: [string, 'null'], format: date }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ScheduleAssignment' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedule-assignments/{schedule_assignment}:
    parameters: [{ name: schedule_assignment, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Scheduling], summary: Show an assignment, responses: { '200': { description: OK } } }
    put:
      tags: [Scheduling]
      summary: Change shift, anchor or end (not past the next period); backdated corrections allowed
      requestBody:
        content: { application/json: { schema: { type: object, properties: { shift_id: { type: integer }, anchor_date: { type: string, format: date }, effective_to: { type: [string, 'null'], format: date } } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Scheduling]
      summary: Delete a period (the next level down applies)
      responses: { '204': { description: Deleted } }

  /api/v1/temporary-schedules:
    get:
      tags: [Scheduling]
      summary: Temporary overrides across employees (schedules.view); managers see only their people's
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [date_from, -date_from, created_at, -created_at], default: -date_from } }
        - { name: search, in: query, schema: { type: string }, description: Employee name or code }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: active_on, in: query, schema: { type: string, format: date } }
        - { name: kind, in: query, schema: { type: string, enum: [shift, day_off] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TemporarySchedule' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/employees/{employee}/temporary-schedules:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Scheduling]
      summary: An employee's temporary overrides (schedules.view, visible employee)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TemporarySchedule' } } } } } } } }
    post:
      tags: [Scheduling]
      summary: Override shift or give days off for a date range (schedules.manage). Ranges never overlap.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryScheduleInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/temporary-schedules/{temporarySchedule}:
    parameters: [{ name: temporarySchedule, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Scheduling]
      summary: Update an override (partial)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryScheduleInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete: { tags: [Scheduling], summary: Remove an override, responses: { '204': { description: Deleted } } }

  /api/v1/employees/{employee}/schedule:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Scheduling]
      summary: Resolved schedule for up to 62 days (schedules.view, visible employee)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Every date in range, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ResolvedDay' } } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/schedule:
    get:
      tags: [Scheduling]
      summary: The signed-in employee's resolved schedule (404 if the login has no employee)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK }, '404': { description: Not linked } }
  /api/v1/roster:
    get:
      tags: [Scheduling]
      summary: Visible employees (paginated) × 1–31 days, resolved (schedules.view)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
        - { name: department_id, in: query, schema: { type: integer }, description: Includes sub-departments (current assignment) }
        - { name: group_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 50, default: 25 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates: { type: array, items: { type: string, format: date } }
                  data: { type: array, items: { type: object, properties: { employee: { type: object }, days: { type: array, items: { $ref: '#/components/schemas/ResolvedDay' } } } } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /api/v1/holidays:
    get:
      tags: [Scheduling]
      summary: Holidays occurring in a year, recurring ones included (holidays.view)
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: location_id, in: query, schema: { type: integer }, description: Workspace-wide plus this location }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Holiday' } } } } } } } }
    post:
      tags: [Scheduling]
      summary: Create a holiday (holidays.manage); one per date and scope
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HolidayInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/holidays/{holiday}:
    parameters: [{ name: holiday, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Scheduling], summary: Show a holiday, responses: { '200': { description: OK } } }
    put:
      tags: [Scheduling]
      summary: Update a holiday (partial)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/HolidayInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete: { tags: [Scheduling], summary: Delete a holiday (all years if recurring), responses: { '204': { description: Deleted } } }

  # ---------------------------------------------------------------- attendance (Module 5)
  /api/v1/punches:
    post:
      tags: [Attendance]
      summary: Ingest one punch (punch source key)
      description: |
        Stores the raw punch and answers 202; matching and attendance run on the queue. Duplicates
        (same source + identifier + instant, or same source + idempotency_key) answer 202 with
        `status: duplicate` and the original id. Punches older than `attendance.backlog_days` are kept
        but never counted. Rate limited per source key (PUNCH_RATE_LIMIT, default 600/min).
      security: [{ PunchSourceKey: [] }]
      parameters:
        - { name: X-Timestamp, in: header, schema: { type: string }, description: Unix seconds; required for signed sources (±300 s) }
        - { name: X-Signature, in: header, schema: { type: string }, description: 'sha256=<hex HMAC-SHA256 of "<timestamp>.<raw body>" with the signing secret>; signed sources only' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PunchInput' } } } }
      responses:
        '202': { description: Stored (or duplicate), content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PunchResult' } } } } } }
        '401': { description: Missing/invalid key, or missing/expired/invalid signature }
        '403': { description: Source inactive, or address not in the source's allowlist }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/punches/batch:
    post:
      tags: [Attendance]
      summary: Ingest up to attendance.max_batch_size punches in one transaction
      description: Each item is validated on its own; valid items are stored, invalid ones reported. Results keep the request index.
      security: [{ PunchSourceKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [punches], properties: { punches: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PunchInput' } } } } } }
      responses:
        '202':
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, properties: { index: { type: integer }, status: { type: string, enum: [accepted, duplicate, invalid] }, id: { type: [integer, 'null'] }, errors: { type: [object, 'null'] } } } }
                  meta: { type: object, properties: { accepted: { type: integer }, duplicate: { type: integer }, invalid: { type: integer } } }
        '401': { description: Invalid key or signature }
        '422': { description: Empty or oversized batch }

  /api/v1/punch-sources:
    get:
      tags: [Attendance]
      summary: Devices and integrations (punch-sources.manage, Tenant Admin)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PunchSource' } } } } } } } }
    post:
      tags: [Attendance]
      summary: Create a source; the key (and signing secret) are returned once
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, kind], properties: { name: { type: string, maxLength: 120 }, kind: { type: string, enum: [device, integration] }, ip_allowlist: { type: [array, 'null'], maxItems: 20, items: { type: string, description: IP or CIDR } }, signed: { type: boolean } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PunchSourceSecrets' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/punch-sources/{punchSource}:
    parameters: [{ name: punchSource, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Attendance], summary: Show a source, responses: { '200': { description: OK } } }
    put:
      tags: [Attendance]
      summary: Rename, change kind or allowlist, activate/deactivate
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, kind: { type: string, enum: [device, integration] }, ip_allowlist: { type: [array, 'null'], items: { type: string } }, is_active: { type: boolean } } } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Attendance]
      summary: Delete a source that never sent a punch
      responses: { '204': { description: Deleted }, '409': { description: 'punch_source_in_use: deactivate instead' } }
  /api/v1/punch-sources/{punchSource}/rotate-key:
    parameters: [{ name: punchSource, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Attendance]
      summary: New key (and signing secret if signed); the old key stops working at once
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PunchSourceSecrets' } } } } }

  /api/v1/raw-punches:
    get:
      tags: [Attendance]
      summary: The raw punch log, read-only (punches.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [punched_at, -punched_at, received_at, -received_at], default: -punched_at } }
        - { name: search, in: query, schema: { type: string }, description: Identifier as sent }
        - { name: punch_source_id, in: query, schema: { type: integer } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date }, description: UTC date }
        - { name: to, in: query, schema: { type: string, format: date }, description: UTC date }
        - { name: state, in: query, schema: { type: string, enum: [matched, unmatched, too_old] } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/RawPunch' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } } }

  /api/v1/orphan-punches:
    get:
      tags: [Attendance]
      summary: Punches whose identifier matched nobody (punches.view); open unless status says otherwise
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed], default: open } }
        - { name: search, in: query, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OrphanPunch' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } } }
  /api/v1/orphan-punches/{orphanPunch}/link:
    parameters: [{ name: orphanPunch, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Attendance]
      summary: Link the identifier to an employee (punches.manage)
      description: The identifier becomes one of the employee's punch identifiers; every open orphan with it is matched and attendance recalculated.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [employee_id], properties: { employee_id: { type: integer } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { linked: { type: integer } } } } } }
        '409': { description: Already linked or dismissed }
        '422': { description: The identifier is another employee's code or identifier }
  /api/v1/orphan-punches/{orphanPunch}/dismiss:
    parameters: [{ name: orphanPunch, in: path, required: true, schema: { type: integer } }]
    post: { tags: [Attendance], summary: Mark as not an employee's punch (never counted), responses: { '200': { description: OK }, '409': { description: Already decided } } }

  /api/v1/employees/{employee}/punch-identifiers:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Attendance], summary: Extra identifiers (badges, cards) of an employee (punches.view), responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PunchIdentifier' } } } } } } } } }
    post:
      tags: [Attendance]
      summary: Add an identifier (punches.manage); open orphans with it are linked
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string, maxLength: 64 }, label: { type: [string, 'null'], maxLength: 60 } } } } } }
      responses: { '201': { description: Created }, '422': { description: Taken by another identifier, or equal to an employee code } }
  /api/v1/punch-identifiers/{punchIdentifier}:
    parameters: [{ name: punchIdentifier, in: path, required: true, schema: { type: integer } }]
    delete: { tags: [Attendance], summary: Remove an identifier (matched punches stay with the employee), responses: { '204': { description: Deleted } } }

  /api/v1/attendance:
    get:
      tags: [Attendance]
      summary: Calculated days of the viewer's employees (attendance.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [work_date, -work_date, worked_minutes, -worked_minutes, late_minutes, -late_minutes, first_in_at, -first_in_at], default: -work_date } }
        - { name: search, in: query, schema: { type: string }, description: Employee name or code }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string }, description: One status or a comma-separated list }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: department_id, in: query, schema: { type: integer }, description: Department recorded on the day, incl. sub-departments }
        - { name: group_id, in: query, schema: { type: integer }, description: Current group membership }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } } }
  /api/v1/attendance/summary:
    get:
      tags: [Attendance]
      summary: Counts per status on one date (the Today board)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: group_id, in: query, schema: { type: integer } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { date: { type: string, format: date }, counts: { type: object, additionalProperties: { type: integer } }, total: { type: integer } } } } } } } } }
  /api/v1/attendance/{attendanceDay}:
    parameters: [{ name: attendanceDay, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Attendance]
      summary: One day with periods, punches and corrections (attendance.view and visible employee, or the employee themself)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AttendanceDay' }, corrections: { type: array, items: { $ref: '#/components/schemas/PunchCorrection' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/attendance/recalculate:
    post:
      tags: [Attendance]
      summary: Queue a recalculation of up to 92 days (attendance.manage)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from, to], properties: { from: { type: string, format: date }, to: { type: string, format: date }, employee_id: { type: [integer, 'null'], description: null = everyone } } } } } }
      responses: { '202': { description: Queued }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/employees/{employee}/attendance:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Attendance]
      summary: Calculated days of one employee, up to 62 days (attendance.view, visible employee)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } } } } } } } }
  /api/v1/me/attendance:
    get:
      tags: [Attendance]
      summary: The signed-in employee's own days (404 when the login has no employee)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK }, '404': { description: Not linked } }

  /api/v1/punch-corrections:
    get:
      tags: [Attendance]
      summary: Corrections of the viewer's employees (corrections.request or corrections.approve)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, work_date, -work_date], default: -created_at } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: kind, in: query, schema: { type: string, enum: [add, ignore] } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PunchCorrection' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } } }
    post:
      tags: [Attendance]
      summary: Request a correction (corrections.request, visible employee)
      description: |
        Entered by someone who sees everyone and may approve (HR, Tenant Admin): approved at once.
        Otherwise pending. add needs punched_at within the work date ±1 day; ignore needs one of the
        employee's raw punches not already ignored or pending.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [employee_id, work_date, kind, reason], properties: { employee_id: { type: integer }, work_date: { type: string, format: date }, kind: { type: string, enum: [add, ignore] }, punched_at: { type: string, format: date-time, description: 'add: ISO 8601 with offset' }, raw_punch_id: { type: integer, description: ignore }, reason: { type: string, minLength: 3, maxLength: 255 } } } } }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/punch-corrections/{punchCorrection}/approve:
    parameters: [{ name: punchCorrection, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Attendance]
      summary: Approve (corrections.approve; never your own request or about yourself); recalculates the day
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } } }
      responses: { '200': { description: OK }, '403': { description: 'correction_own' }, '409': { description: 'correction_decided' } }
  /api/v1/punch-corrections/{punchCorrection}/reject:
    parameters: [{ name: punchCorrection, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Attendance]
      summary: Reject (same rules as approve)
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } } }
      responses: { '200': { description: OK }, '403': { description: 'correction_own' }, '409': { description: 'correction_decided' } }

  # ---------------------------------------------------------------- leave (Module 6)
  /api/v1/leave-types:
    get:
      tags: [Leave]
      summary: Active leave types (anyone with leave.request, leave.view or leave.manage); ?all=1 adds inactive ones (leave.manage)
      parameters: [{ name: all, in: query, schema: { type: boolean } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LeaveType' } } } } } } } }
    post:
      tags: [Leave]
      summary: Create a leave type (leave.manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveTypeInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/leave-types/{leaveType}:
    parameters: [{ name: leaveType, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Leave]
      summary: Update a leave type (partial); applies from now on
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LeaveTypeInput' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Leave]
      summary: Delete a type never requested and without ledger entries
      responses: { '204': { description: Deleted }, '409': { description: 'leave_type_in_use: deactivate instead' } }

  /api/v1/leave-requests:
    get:
      tags: [Leave]
      summary: Leave requests of the viewer's employees (leave.request or leave.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [start_date, -start_date, created_at, -created_at], default: -start_date } }
        - { name: search, in: query, schema: { type: string }, description: Employee name or code }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
        - { name: leave_type_id, in: query, schema: { type: integer } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: department_id, in: query, schema: { type: integer }, description: Current department, incl. sub-departments }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: mine, in: query, schema: { type: boolean }, description: Only the viewer's own }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } } }
    post:
      tags: [Leave]
      summary: Request leave (leave.request, visible employee)
      description: |
        Counts scheduled working days only. Refused when it overlaps active leave (opposite halves are fine), has
        no working days, or the balance would go below the type's negative limit. Entered by HR / a Tenant Admin for
        someone else: approved at once (ledger debit, LeaveChanged).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequestInput' } } } }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/leave-requests/preview:
    post:
      tags: [Leave]
      summary: Counted days and the balance after, without saving
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequestInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LeavePreview' } } } } } } }
  /api/v1/leave-requests/{leaveRequest}:
    parameters: [{ name: leaveRequest, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Leave], summary: One request with its counted days, responses: { '200': { description: OK } } }
  /api/v1/leave-requests/{leaveRequest}/approve:
    parameters: [{ name: leaveRequest, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Leave]
      summary: Approve (leave.approve; never own); re-checks the balance, debits the ledger, fires LeaveChanged
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } } }
      responses: { '200': { description: OK }, '403': { description: 'leave_own / leave_forbidden' }, '409': { description: leave_decided }, '422': { description: leave_balance } }
  /api/v1/leave-requests/{leaveRequest}/reject:
    parameters: [{ name: leaveRequest, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Leave]
      summary: Reject (same rules as approve)
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } } }
      responses: { '200': { description: OK }, '403': { description: Not allowed }, '409': { description: leave_decided } }
  /api/v1/leave-requests/{leaveRequest}/cancel:
    parameters: [{ name: leaveRequest, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Leave]
      summary: Cancel; approved leave is credited back
      description: Pending or approved-not-started — the requester, the employee or an approver. Started/past approved leave — leave.manage only.
      responses: { '200': { description: OK }, '403': { description: leave_not_cancellable }, '409': { description: Already closed } }

  /api/v1/leave-calendar:
    get:
      tags: [Leave]
      summary: Pending and approved leave overlapping a range, with counted days (leave.view, at most 62 days)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: department_id, in: query, schema: { type: integer } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } } } } } } } }

  /api/v1/employees/{employee}/leave-balances:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Leave]
      summary: Balances per type for a leave year (leave.view, visible employee; default current year)
      parameters: [{ name: year, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveBalances' } } } } }
  /api/v1/employees/{employee}/leave-ledger:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Leave]
      summary: Ledger entries of a leave year (leave.view, visible employee)
      parameters: [{ name: year, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { leave_year: { type: integer }, data: { type: array, items: { $ref: '#/components/schemas/LeaveLedgerEntry' } } } } } } } }
  /api/v1/me/leave-balances:
    get:
      tags: [Leave]
      summary: The signed-in employee's balances (404 when the login has no employee)
      parameters: [{ name: year, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveBalances' } } } }, '404': { description: Not linked } }
  /api/v1/leave-adjustments:
    post:
      tags: [Leave]
      summary: Manual credit (+) or debit (−) with a reason (leave.manage); refused for unlimited types
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [employee_id, leave_type_id, days, reason], properties: { employee_id: { type: integer }, leave_type_id: { type: integer }, days: { type: number, multipleOf: 0.5, description: Non-zero }, leave_year: { type: integer, description: Default current }, reason: { type: string, minLength: 3, maxLength: 255 } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/LeaveLedgerEntry' } } } } } }, '422': { $ref: '#/components/responses/ValidationError' } }

  # ---------------------------------------------------------------- overtime (Module 7)
  /api/v1/overtime:
    get:
      tags: [Overtime]
      summary: Overtime records of the people the viewer can see (overtime.view)
      description: |
        Calculated records are written by the attendance writer job (listener on AttendanceRecalculated) and
        manual ones by HR. A record with 0 calculated minutes is only kept when it was already decided (it went back
        to pending with changed_after_decision).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: sort, in: query, schema: { type: string, enum: [work_date, -work_date, calculated_minutes, -calculated_minutes], default: -work_date } }
        - { name: search, in: query, schema: { type: string }, description: Employee name or code }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: source, in: query, schema: { type: string, enum: [calculated, manual] } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: department_id, in: query, schema: { type: integer }, description: Current department, incl. sub-departments }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: changed, in: query, schema: { type: boolean }, description: Only records changed after a decision }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OvertimeRecord' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/overtime/summary:
    get:
      tags: [Overtime]
      summary: Approved and pending overtime per employee over a range (overtime.view); same filters as the list
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: search, in: query, schema: { type: string } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OvertimeSummaryRow' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } } } } } }
  /api/v1/overtime/{overtimeRecord}/approve:
    parameters: [{ name: overtimeRecord, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Overtime]
      summary: Approve all or fewer minutes (overtime.approve; the employee must be visible; never one's own)
      description: approved_weighted_minutes = weighted_minutes × minutes ÷ calculated_minutes (rounded down).
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/OvertimeDecision' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OvertimeRecord' } } } } } }
        '403': { description: 'overtime_own (own overtime) or missing permission', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '409': { description: 'overtime_decided (not pending) or overtime_empty (0 minutes left)', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/overtime/{overtimeRecord}/reject:
    parameters: [{ name: overtimeRecord, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Overtime]
      summary: Reject with an optional note (overtime.approve; never one's own)
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OvertimeRecord' } } } } } }
        '403': { description: 'overtime_own or missing permission', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '409': { description: 'overtime_decided', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
  /api/v1/overtime/approve-batch:
    post:
      tags: [Overtime]
      summary: Approve up to 200 pending records in full (overtime.approve)
      description: Records that are not visible, one's own, not pending or at 0 minutes are skipped, not errors.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { approved: { type: integer }, skipped: { type: integer } } } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/overtime/recalculate:
    post:
      tags: [Overtime]
      summary: Queue a recalculation with the current settings (overtime.manage); at most 92 days
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from, to], properties: { from: { type: string, format: date }, to: { type: string, format: date }, employee_id: { type: [integer, 'null'], description: One visible employee; omitted = everyone } } } } } }
      responses: { '202': { description: Queued }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }

  /api/v1/overtime-entries:
    post:
      tags: [Overtime]
      summary: Record manual overtime (overtime.manage), e.g. work without punches
      description: |
        One manual entry per employee and day, not in the future. Entered by HR or a Tenant Admin for someone else:
        approved at once; otherwise pending.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OvertimeEntryInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OvertimeRecord' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/overtime-entries/{overtimeRecord}:
    parameters: [{ name: overtimeRecord, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Overtime]
      summary: Change minutes, kind or reason of a pending manual entry (overtime.manage)
      requestBody: { content: { application/json: { schema: { type: object, properties: { minutes: { type: integer, minimum: 1, maximum: 1440 }, kind: { type: string, enum: [workday, rest_day, holiday] }, reason: { type: string, minLength: 3, maxLength: 255 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OvertimeRecord' } } } } } }
        '409': { description: 'overtime_calculated (not a manual entry) or overtime_decided', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Overtime]
      summary: Delete a pending manual entry (overtime.manage)
      responses: { '204': { description: Deleted }, '409': { description: 'overtime_calculated or overtime_decided', content: { application/json: { schema: { $ref: '#/components/schemas/BusinessRuleError' } } } } }

  /api/v1/employees/{employee}/overtime:
    parameters: [{ name: employee, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Overtime]
      summary: One employee's overtime over a range of at most 62 days (overtime.view, visible employee)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OvertimeRecord' } } } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/me/overtime:
    get:
      tags: [Overtime]
      summary: The signed-in employee's own overtime (any signed-in user linked to an employee); at most 62 days
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OvertimeRecord' } } } } } } }, '404': { description: Login not linked to an employee } }

components:
  securitySchemes:
    PunchSourceKey:
      type: http
      scheme: bearer
      description: Punch source key from the create / rotate-key response (ingestion endpoints only).

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }

  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string }
              remember: { type: boolean }

  responses:
    Unauthenticated: { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    Forbidden: { description: Missing permission, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    WorkspaceNotFound: { description: 'Unknown subdomain (`{"message":"Workspace not found."}`)', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    WorkspaceSuspended: { description: Workspace suspended, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    TooManyRequests: { description: Rate limited (login 5/min per host+email+IP by default) }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }

  schemas:
    Message: { type: object, properties: { message: { type: string } } }
    BusinessRuleError:
      type: object
      properties:
        message: { type: string }
        rule: { type: string, enum: [plan_in_use, tenant_not_active, tenant_not_suspended, self_modification, self_deletion, admin_role_restricted, last_tenant_admin] }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        from: { type: [integer, 'null'] }
        to: { type: [integer, 'null'] }
    Role: { type: string, enum: [tenant-admin, hr-manager, department-manager, employee] }
    UserStatus: { type: string, enum: [active, inactive] }
    TenantStatus: { type: string, enum: [provisioning, active, suspended] }

    SuperAdmin:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { const: super-admin }
        last_login_at: { type: [string, 'null'], format: date-time }
    SuperAdminEnvelope: { type: object, properties: { data: { $ref: '#/components/schemas/SuperAdmin' } } }

    Plan:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        max_employees: { type: [integer, 'null'], description: null = unlimited }
        features: { type: array, items: { type: string } }
        is_active: { type: boolean }
        tenants_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlanInput:
      type: object
      required: [name, slug, max_employees]
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        max_employees: { type: [integer, 'null'], minimum: 1 }
        features: { type: array, maxItems: 50, items: { type: string, maxLength: 50 } }
        is_active: { type: boolean, default: true }
    PlanEnvelope: { type: object, properties: { data: { $ref: '#/components/schemas/Plan' } } }
    PlanPage: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Plan' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subdomain: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        plan: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TenantEnvelope: { type: object, properties: { data: { $ref: '#/components/schemas/Tenant' } } }
    TenantPage: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Tenant' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        role: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserEnvelope: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
    UserPage: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/User' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }

    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        permissions: { type: array, items: { type: string }, example: [audit-logs.view, settings.view, users.view] }
        workspace:
          type: object
          properties:
            name: { type: string }
            timezone: { type: string }
            date_format: { type: string }
            time_format: { type: string }
            week_start: { type: integer, minimum: 0, maximum: 6 }
    SessionEnvelope: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } }

    Setting:
      type: object
      properties:
        key: { type: string, example: general.timezone }
        group: { type: string, example: general }
        type: { type: string, enum: [string, integer, boolean] }
        label: { type: string }
        description: { type: [string, 'null'] }
        options: { type: [array, 'null'], items: { type: [string, integer] } }
        default: { type: [string, integer, boolean] }
        value: { type: [string, integer, boolean, 'null'] }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, enum: [created, updated, deleted, restored, role_changed] }
        actor: { type: object, properties: { type: { type: string, enum: [user, super_admin, system] }, id: { type: [integer, 'null'] }, name: { type: [string, 'null'] } } }
        subject: { type: object, properties: { type: { type: string }, id: { type: string } } }
        before: { type: [object, 'null'], description: 'Changed attributes before; secrets appear as "[redacted]"' }
        after: { type: [object, 'null'] }
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    AuditLogPage: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }, meta: { $ref: '#/components/schemas/PaginationMeta' } } }

    # ---------------------------------------------------------------- Module 2
    EmploymentType: { type: string, enum: [full_time, part_time, contract, temporary, intern] }
    ManagerSummary: { type: object, properties: { id: { type: integer }, name: { type: string }, email: { type: string }, status: { type: string } } }
    ManagerIds: { type: object, required: [user_ids], properties: { user_ids: { type: array, maxItems: 50, items: { type: integer } } } }
    OrganizationProfile:
      type: object
      properties:
        legal_name: { type: string, maxLength: 160 }
        display_name: { type: [string, 'null'] }
        registration_number: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
    Location:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        address: { type: [string, 'null'] }
        timezone: { type: [string, 'null'], description: null means workspace timezone }
        is_active: { type: boolean }
    LocationInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 30, description: 'Unique, case-insensitive' }
        address: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        is_active: { type: boolean }
    Department:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        name: { type: string }
        code: { type: string }
        is_active: { type: boolean }
        depth: { type: integer, description: Tree listing only }
        path: { type: string, example: Operations / Warehouse }
        employees_count: { type: integer, description: Current direct headcount }
        managers: { type: array, items: { $ref: '#/components/schemas/ManagerSummary' } }
    DepartmentInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 30 }
        parent_id: { type: [integer, 'null'] }
        is_active: { type: boolean }
    Group:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        priority: { type: integer, description: Lower wins when an employee is in several groups }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
        members_count: { type: integer }
        managers: { type: array, items: { $ref: '#/components/schemas/ManagerSummary' } }
    GroupInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 30 }
        priority: { type: integer, minimum: 1, description: Unique }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
    Employee:
      type: object
      properties:
        id: { type: integer }
        employee_code: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        job_title: { type: [string, 'null'] }
        employment_type: { $ref: '#/components/schemas/EmploymentType' }
        status: { type: string, enum: [active, inactive, terminated] }
        hire_date: { type: string, format: date }
        termination_date: { type: [string, 'null'], format: date }
        user_id: { type: [integer, 'null'] }
        department: { type: [object, 'null'], description: As of today, properties: { id: { type: integer }, name: { type: string } } }
        location: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string }, timezone: { type: [string, 'null'] } } }
        groups: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, priority: { type: integer }, since: { type: string, format: date } } } }
    EmployeeHistory:
      type: object
      properties:
        assignments:
          type: array
          items: { type: object, properties: { id: { type: integer }, department: { type: object }, location: { type: [object, 'null'] }, effective_from: { type: string, format: date }, effective_to: { type: [string, 'null'], format: date } } }
        memberships:
          type: array
          items: { type: object, properties: { id: { type: integer }, group: { type: object }, effective_from: { type: string, format: date }, effective_to: { type: [string, 'null'], format: date } } }
    EmployeeImport:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, processing, completed, failed] }
        original_name: { type: [string, 'null'] }
        total_rows: { type: integer }
        created_count: { type: integer }
        failed_count: { type: integer }
        errors: { type: array, items: { type: object, properties: { row: { type: integer, description: CSV line number (header is line 1) }, code: { type: [string, 'null'] }, messages: { type: array, items: { type: string } } } } }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------------- Module 3
    TimetableBreak:
      type: object
      properties:
        kind: { type: string, enum: [fixed, floating] }
        start_offset: { type: [integer, 'null'], description: Minutes after the timetable start (fixed only) }
        duration_minutes: { type: integer, minimum: 1, maximum: 720 }
        is_paid: { type: boolean }
    Timetable:
      type: object
      description: All times are whole minutes from local midnight; end_minute above 1440 is the next day.
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        type: { type: string, enum: [fixed, flexible] }
        color: { type: [string, 'null'], example: '#3b82f6' }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440, description: 'Fixed: the shift; flexible: the window' }
        end_minute: { type: integer }
        crosses_midnight: { type: boolean }
        required_minutes: { type: [integer, 'null'], description: Flexible only }
        core_start_offset: { type: [integer, 'null'], description: Flexible only, minutes after window start }
        core_duration_minutes: { type: [integer, 'null'] }
        late_grace_minutes: { type: [integer, 'null'], description: null = workspace default }
        early_leave_grace_minutes: { type: [integer, 'null'] }
        check_in_before_minutes: { type: [integer, 'null'] }
        check_out_after_minutes: { type: [integer, 'null'] }
        min_work_minutes: { type: [integer, 'null'] }
        work_minutes: { type: integer, description: 'Fixed: length minus unpaid breaks; flexible: required minutes' }
        is_active: { type: boolean }
        breaks: { type: array, items: { $ref: '#/components/schemas/TimetableBreak' } }
        shifts_count: { type: integer, description: List only }
    TimetableInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 30 }
        type: { type: string, enum: [fixed, flexible] }
        color: { type: [string, 'null'] }
        start_minute: { type: integer }
        duration_minutes: { type: integer }
        required_minutes: { type: [integer, 'null'] }
        core_start_offset: { type: [integer, 'null'] }
        core_duration_minutes: { type: [integer, 'null'] }
        late_grace_minutes: { type: [integer, 'null'] }
        early_leave_grace_minutes: { type: [integer, 'null'] }
        check_in_before_minutes: { type: [integer, 'null'] }
        check_out_after_minutes: { type: [integer, 'null'] }
        min_work_minutes: { type: [integer, 'null'] }
        is_active: { type: boolean }
        breaks: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/TimetableBreak' } }
    TimetableDetail:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Timetable' }
        meta:
          type: object
          properties:
            locked: { type: boolean, description: Used by a schedule; time rules and breaks are read-only }
            effective: { type: object, properties: { late_grace_minutes: { type: integer }, early_leave_grace_minutes: { type: integer }, check_in_before_minutes: { type: integer }, check_out_after_minutes: { type: integer } } }
    Shift:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        cycle_unit: { type: string, enum: [day, week] }
        cycle_length: { type: integer, description: 'Days (max 56) or weeks (max 8)' }
        cycle_days: { type: integer }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }
        working_days: { type: integer }
        days:
          type: array
          description: Working days only; for week cycles day_index 0 is a Monday
          items: { type: object, properties: { day_index: { type: integer }, timetables: { type: array, items: { type: object } } } }
    ShiftInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 30 }
        cycle_unit: { type: string, enum: [day, week] }
        cycle_length: { type: integer, minimum: 1 }
        description: { type: [string, 'null'] }
        is_active: { type: boolean }

    # ---------------------------------------------------------------- Module 4
    ScheduleAssignment:
      type: object
      properties:
        id: { type: integer }
        target: { type: object, properties: { type: { type: string, enum: [organization, department, group, employee] }, id: { type: [integer, 'null'] }, name: { type: [string, 'null'], description: null when the target was deleted } } }
        shift: { type: object, properties: { id: { type: integer }, name: { type: string }, code: { type: string }, cycle_unit: { type: string }, cycle_length: { type: integer } } }
        anchor_date: { type: string, format: date, description: Cycle start }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
    TemporarySchedule:
      type: object
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        employee: { type: object, description: Only on GET /temporary-schedules, properties: { id: { type: integer }, employee_code: { type: string }, full_name: { type: string } } }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        day_off: { type: boolean }
        shift: { type: [object, 'null'] }
        anchor_date: { type: [string, 'null'], format: date }
        reason: { type: [string, 'null'] }
    TemporaryScheduleInput:
      type: object
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date, description: At most 366 days after date_from }
        shift_id: { type: [integer, 'null'], description: null = day off }
        anchor_date: { type: [string, 'null'], format: date }
        reason: { type: [string, 'null'], maxLength: 255 }
    Holiday:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        occurs_on: { type: string, format: date, description: Date in the requested year }
        name: { type: string }
        recurs_yearly: { type: boolean }
        location: { type: [object, 'null'], description: null = everyone }
    HolidayInput:
      type: object
      properties:
        date: { type: string, format: date }
        name: { type: string, maxLength: 120 }
        location_id: { type: [integer, 'null'] }
        recurs_yearly: { type: boolean }
    ResolvedDay:
      type: object
      description: What an employee is scheduled to do on one work date, and which level decided it.
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [working, rest, holiday, day_off, unscheduled, not_employed] }
        source:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [temporary, employee, group, department, organization] }
            id: { type: [integer, 'null'] }
            name: { type: [string, 'null'] }
            inherited_from: { type: [string, 'null'], description: Ancestor department whose schedule was inherited }
        shift: { type: [object, 'null'] }
        holiday: { type: [string, 'null'] }
        timezone: { type: string, description: Location timezone on that date, else workspace }
        periods:
          type: array
          description: Kept on holidays (for overtime rules); empty on rest days
          items: { type: object, properties: { timetable: { type: object }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, minutes: { type: integer } } }
    # ---------------------------------------------------------------- Module 5
    PunchInput:
      type: object
      required: [employee_identifier, punched_at]
      properties:
        employee_identifier: { type: string, maxLength: 64, description: Employee code or one of the employee's punch identifiers }
        punched_at: { type: string, format: date-time, description: 'ISO 8601 with offset (Z or ±hh:mm); at most 5 minutes in the future' }
        direction: { type: [string, 'null'], enum: [in, out, null], description: Used only when attendance.use_punch_direction is on }
        idempotency_key: { type: [string, 'null'], maxLength: 100 }
        meta: { type: [object, 'null'], description: Free-form, at most 2 KB as JSON }
    PunchResult:
      type: object
      properties:
        id: { type: integer, description: Raw punch id (the original one for a duplicate) }
        status: { type: string, enum: [accepted, duplicate] }
    PunchSource:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [device, integration] }
        key_hint: { type: string, example: ams_ab12cd34ef_… }
        signed: { type: boolean }
        ip_allowlist: { type: array, items: { type: string } }
        is_active: { type: boolean }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    PunchSourceSecrets:
      type: object
      description: Only returned by create and rotate-key; never retrievable again.
      properties:
        data: { $ref: '#/components/schemas/PunchSource' }
        key: { type: string, example: ams_ab12cd34ef_<40 characters> }
        signing_secret: { type: [string, 'null'] }
    RawPunch:
      type: object
      properties:
        id: { type: integer }
        source: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        employee_identifier: { type: string }
        punched_at: { type: string, format: date-time }
        direction: { type: [string, 'null'] }
        idempotency_key: { type: [string, 'null'] }
        meta: { type: [object, 'null'] }
        too_old: { type: boolean }
        received_at: { type: string, format: date-time }
        state: { type: string, enum: [matched, unmatched, dismissed, pending] }
        employee: { type: [object, 'null'] }
    OrphanPunch:
      type: object
      properties:
        id: { type: integer }
        raw_punch_id: { type: integer }
        employee_identifier: { type: string }
        punched_at: { type: string, format: date-time }
        too_old: { type: boolean }
        source: { type: object }
        status: { type: string, enum: [open, resolved, dismissed] }
        employee: { type: [object, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
    PunchIdentifier:
      type: object
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        identifier: { type: string }
        label: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    AttendanceDay:
      type: object
      description: Calculated attendance of one employee on one work date. Instants are UTC; display them in `timezone`.
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        employee: { type: object, description: On lists and the detail }
        work_date: { type: string, format: date }
        status: { type: string, enum: [present, late, early_leave, late_early, incomplete, absent, in_progress, on_leave, holiday, rest, day_off, unscheduled, not_employed] }
        timezone: { type: string }
        holiday_name: { type: [string, 'null'] }
        leave_name: { type: [string, 'null'], description: Approved leave on the day (Module 6) }
        leave_portion: { type: [string, 'null'], enum: [full, first_half, second_half, null] }
        schedule_source: { type: [string, 'null'], enum: [temporary, employee, group, department, organization, null] }
        shift_id: { type: [integer, 'null'] }
        department_id: { type: [integer, 'null'], description: Department on that day }
        location_id: { type: [integer, 'null'] }
        first_in_at: { type: [string, 'null'], format: date-time }
        last_out_at: { type: [string, 'null'], format: date-time }
        scheduled_minutes: { type: integer }
        worked_minutes: { type: integer }
        late_minutes: { type: integer }
        early_leave_minutes: { type: integer }
        unmatched_punches: { type: integer, description: Punches outside every window on a working day (not counted) }
        flags: { type: array, items: { type: string, enum: [missing_in, missing_out, missed_period, below_minimum, off_day_work, half_day_leave] } }
        calculated_at: { type: string, format: date-time, description: When the result last changed }
        periods:
          type: array
          description: Detail endpoint only
          items: { type: object, properties: { timetable_name: { type: string }, flexible: { type: boolean }, scheduled_start_at: { type: string, format: date-time }, scheduled_end_at: { type: string, format: date-time }, in_at: { type: [string, 'null'] }, out_at: { type: [string, 'null'] }, worked_minutes: { type: integer }, break_minutes: { type: integer }, late_minutes: { type: integer }, early_leave_minutes: { type: integer } } }
        punches:
          type: array
          description: Detail endpoint only
          items: { type: object, properties: { raw_punch_id: { type: [integer, 'null'] }, punch_correction_id: { type: [integer, 'null'] }, punched_at: { type: string, format: date-time }, role: { type: string, enum: [in, out, extra, duplicate, unmatched, ignored] }, source: { type: [string, 'null'] } } }
    PunchCorrection:
      type: object
      properties:
        id: { type: integer }
        employee: { type: object }
        work_date: { type: string, format: date }
        kind: { type: string, enum: [add, ignore] }
        punched_at: { type: [string, 'null'], format: date-time }
        raw_punch: { type: [object, 'null'] }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requested_by: { type: [object, 'null'] }
        decided_by: { type: [object, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        can_decide: { type: boolean, description: Whether the viewer may approve or reject it }
    # ---------------------------------------------------------------- Module 6
    LeaveType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        color: { type: [string, 'null'] }
        is_paid: { type: boolean }
        accrual: { type: string, enum: [none, yearly, monthly] }
        entitlement_days: { type: number }
        carry_forward_max_days: { type: [number, 'null'], description: null = nothing carries over }
        negative_limit_days: { type: number }
        unlimited: { type: boolean, description: No balance kept or checked }
        is_active: { type: boolean }
    LeaveTypeInput:
      type: object
      description: Amounts in days, half-day steps. Unlimited types drop accrual, entitlement and carry-over.
      properties:
        name: { type: string, maxLength: 80 }
        code: { type: string, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$' }
        color: { type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$' }
        is_paid: { type: boolean }
        accrual: { type: string, enum: [none, yearly, monthly] }
        entitlement_days: { type: number, multipleOf: 0.5 }
        carry_forward_max_days: { type: [number, 'null'], multipleOf: 0.5 }
        negative_limit_days: { type: number, multipleOf: 0.5 }
        unlimited: { type: boolean }
        is_active: { type: boolean }
    LeaveRequestInput:
      type: object
      required: [employee_id, leave_type_id, start_date, end_date]
      properties:
        employee_id: { type: integer }
        leave_type_id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        half_start: { type: boolean, description: First day counts its second half only }
        half_end: { type: boolean, description: Last day counts its first half only }
        reason: { type: [string, 'null'], maxLength: 500 }
    LeaveRequest:
      type: object
      properties:
        id: { type: integer }
        employee: { type: object }
        type: { type: object, properties: { id: { type: integer }, name: { type: string }, code: { type: string }, color: { type: [string, 'null'] }, is_paid: { type: boolean }, unlimited: { type: boolean } } }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        half_start: { type: boolean }
        half_end: { type: boolean }
        days: { type: number, description: Counted (scheduled working) days }
        reason: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        requested_by: { type: [object, 'null'] }
        decided_by: { type: [object, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_note: { type: [string, 'null'] }
        cancelled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        counted_days: { type: array, description: On show and the calendar, items: { type: object, properties: { date: { type: string, format: date }, portion: { type: string, enum: [full, first_half, second_half] } } } }
        can_decide: { type: boolean }
        can_cancel: { type: boolean }
    LeavePreview:
      type: object
      properties:
        days: { type: number }
        counted_days: { type: array, items: { type: object, properties: { date: { type: string, format: date }, portion: { type: string } } } }
        years: { type: array, items: { type: object, properties: { leave_year: { type: integer }, days: { type: number }, available: { type: [number, 'null'] }, after: { type: [number, 'null'] } } } }
        problem: { type: [string, 'null'], description: Why it would be refused (no working days, not enough balance) }
    LeaveBalances:
      type: object
      properties:
        leave_year: { type: integer }
        year_start: { type: string, format: date }
        year_end: { type: string, format: date }
        data:
          type: array
          items:
            type: object
            properties:
              type: { type: object }
              entitled: { type: number, description: Grants + accruals + carry-forward }
              used: { type: number, description: Requests net of cancellations and recounts }
              adjusted: { type: number }
              expired: { type: number }
              balance: { type: number }
              pending: { type: number }
              available: { type: [number, 'null'], description: null for unlimited types }
    LeaveLedgerEntry:
      type: object
      properties:
        id: { type: integer }
        type: { type: object }
        leave_year: { type: integer }
        kind: { type: string, enum: [grant, accrual, carry_forward, expiry, request, cancellation, recount, adjustment] }
        days: { type: number, description: Positive credit, negative debit }
        leave_request_id: { type: [integer, 'null'] }
        reason: { type: [string, 'null'] }
        created_by: { type: [object, 'null'] }
        created_at: { type: string, format: date-time }
    # ---------------------------------------------------------------- Module 7
    OvertimeRecord:
      type: object
      description: Minutes are whole minutes; rates are integer percentages copied from the settings when calculated.
      properties:
        id: { type: integer }
        employee: { type: object, properties: { id: { type: integer }, full_name: { type: string }, employee_code: { type: string } } }
        work_date: { type: string, format: date }
        source: { type: string, enum: [calculated, manual] }
        kind: { type: string, enum: [workday, rest_day, holiday], description: The kind holding most minutes }
        before_minutes: { type: integer, description: Before the scheduled start (only with overtime.count_early_arrival) }
        after_minutes: { type: integer, description: After the scheduled end, capped by worked − scheduled }
        rest_day_minutes: { type: integer }
        holiday_minutes: { type: integer }
        calculated_minutes: { type: integer, description: After the minimum, rounding and daily cap }
        rates: { type: object, properties: { workday: { type: integer }, rest_day: { type: integer }, holiday: { type: integer } } }
        weighted_minutes: { type: integer, description: Sum of minutes × rate ÷ 100 }
        status: { type: string, enum: [pending, approved, rejected] }
        approved_minutes: { type: [integer, 'null'] }
        approved_weighted_minutes: { type: [integer, 'null'] }
        decided_by: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_note: { type: [string, 'null'] }
        changed_after_decision: { type: boolean, description: The calculation changed after a decision; back to pending }
        reason: { type: [string, 'null'], description: Manual entries }
        created_by: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
        can_decide: { type: boolean, description: The viewer may approve or reject it now }
    OvertimeDecision:
      type: object
      properties:
        minutes: { type: [integer, 'null'], minimum: 1, maximum: 1440, description: 'Approve fewer minutes (1..calculated); default all' }
        note: { type: [string, 'null'], maxLength: 255 }
    OvertimeEntryInput:
      type: object
      required: [employee_id, work_date, minutes, kind, reason]
      properties:
        employee_id: { type: integer }
        work_date: { type: string, format: date, description: Not in the future }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        kind: { type: string, enum: [workday, rest_day, holiday], description: Which rate applies }
        reason: { type: string, minLength: 3, maxLength: 255 }
    OvertimeSummaryRow:
      type: object
      properties:
        employee: { type: [object, 'null'], properties: { id: { type: integer }, full_name: { type: string }, employee_code: { type: string } } }
        approved_minutes: { type: integer }
        approved_weighted_minutes: { type: integer }
        approved_workday_minutes: { type: integer, description: Approved minutes split in proportion to the record's kinds }
        approved_rest_day_minutes: { type: integer }
        approved_holiday_minutes: { type: integer }
        pending_minutes: { type: integer }
        pending_count: { type: integer }
